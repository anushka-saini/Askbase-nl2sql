[theme]
base = "dark"
primaryColor = "#6366f1"
backgroundColor = "#0b0f19"
secondaryBackgroundColor = "#111827"
textColor = "#e5e7eb"
borderColor = "#1f2937"
font = "sans-serif"
baseFontSize = 15
baseRadius = "0.6rem"
showSidebarBorder = true
# prompt versions v0..v4 always get these colours in this order
chartCategoricalColors = ["#6366f1", "#f59e0b", "#10b981", "#38bdf8", "#f472b6", "#a3e635", "#9085e9", "#e66767"]

[client]
# no stack traces in the browser
showErrorDetails = "none"
toolbarMode = "minimal"

[browser]
gatherUsageStats = false
